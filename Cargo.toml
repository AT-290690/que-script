[package]
name = "que"
version = "0.1.0"
edition = "2021"

[features]
default = ["compiler"]
compiler = ["dep:wat", "eclisp/io"]
debug-rc = []
repo-tools = []

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "que"
path = "src/bin/que.rs"
required-features = ["compiler"]

[[bin]]
name = "quelsp"
path = "src/bin/quelsp.rs"

[[bin]]
name = "quebake"
path = "src/bin/quebake.rs"
required-features = ["repo-tools"]

[[bin]]
name = "quelibdump"
path = "src/bin/quelibdump.rs"
required-features = ["repo-tools"]

[[bin]]
name = "que-trs"
path = "src/bin/que_trs.rs"
required-features = ["repo-tools"]

[dependencies]
eclisp = { path = "eclisp", default-features = false }
wasm-bindgen = "0.2"
flate2 = "1.1.9"
wat = { version = "1", optional = true }
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"
serde = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
